# Local development database (MySQL 8, same engine as Hostinger).
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tjportfolio
      MYSQL_USER: tj
      MYSQL_PASSWORD: tjdevpass
      MYSQL_ROOT_PASSWORD: rootdevpass
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
volumes:
  mysql-data:
